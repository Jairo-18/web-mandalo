# Config nginx del sitio de cuenta/legal (Astro, HTML estático real: cada
# página es su propio archivo, sin rewrite de SPA). HTTPS lo termina
# Cloudflare/Traefik delante del contenedor (mismo patrón que frontend-mandalo).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json text/html;
  gzip_min_length 1024;

  # Astro genera /ruta/index.html — esto permite /eliminar-cuenta sin la barra.
  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }
}
